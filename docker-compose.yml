services:
  db:
    image: postgres:18-alpine
    container_name: houseflip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: houseflip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-houseflip_dev}
      POSTGRES_DB: houseflip
    ports:
      - "5432:5432"
    volumes:
      - houseflip_pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseflip -d houseflip"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-db:
    image: postgres:18-alpine
    container_name: houseflip-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: houseflip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-houseflip_dev}
      POSTGRES_DB: houseflip_test
    ports:
      - "5433:5432"
    volumes:
      - houseflip_test_pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseflip -d houseflip_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  houseflip_pgdata:
  houseflip_test_pgdata:
